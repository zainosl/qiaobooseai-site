<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1460" viewBox="0 0 1080 1460"><g font-family="PingFang SC,Heiti SC,sans-serif"><rect x="0" y="0" width="1080" height="1460" rx="0" fill="#EEF2F0"/><text x="56" y="63.0" font-size="25" font-weight="600" fill="#137A66">本人实践 / 工具背后的业务需要</text><text x="56" y="135.0" font-size="49" font-weight="700" fill="#14251D">每一个工具，都有它出现的原因</text><text x="56" y="191.0" font-size="28" font-weight="400" fill="#586B60">随着不同问题出现，逐步建设、交叉迭代。</text><text x="56" y="277.0" font-size="28" font-weight="600" fill="#586B60">遇到的需要</text><text x="600" y="277.0" font-size="28" font-weight="600" fill="#586B60">做出的工具与意义</text><path d="M56 317L1024 317" fill="none" stroke="#C2D1C9" stroke-width="2"/><text x="56" y="376.0" font-size="30" font-weight="400" fill="#14251D">别人需要完整了解我</text><text x="600" y="367.0" font-size="39" font-weight="650" fill="#137A66">官网</text><text x="600" y="426.0" font-size="27" font-weight="400" fill="#14251D">集中呈现理念、实践与服务</text><path d="M56 501L1024 501" fill="none" stroke="#C2D1C9" stroke-width="2"/><text x="56" y="560.0" font-size="30" font-weight="400" fill="#14251D">内容说不出自己的意思</text><text x="600" y="551.0" font-size="39" font-weight="650" fill="#137A66">写作系统</text><text x="600" y="610.0" font-size="27" font-weight="400" fill="#14251D">围绕真实意图与具体素材修改</text><path d="M56 685L1024 685" fill="none" stroke="#C2D1C9" stroke-width="2"/><text x="56" y="744.0" font-size="30" font-weight="400" fill="#14251D">经营讨论要接着过去继续</text><text x="600" y="735.0" font-size="39" font-weight="650" fill="#137A66">AI Partner</text><text x="600" y="794.0" font-size="27" font-weight="400" fill="#14251D">读背景、比较选择、接续判断</text><path d="M56 869L1024 869" fill="none" stroke="#C2D1C9" stroke-width="2"/><text x="56" y="928.0" font-size="30" font-weight="400" fill="#14251D">任务多，却难看清业务进展</text><text x="600" y="919.0" font-size="39" font-weight="650" fill="#137A66">AI工作台</text><text x="600" y="978.0" font-size="27" font-weight="400" fill="#14251D">把目标、假设、执行与结果连接</text><path d="M56 1053L1024 1053" fill="none" stroke="#C2D1C9" stroke-width="2"/><text x="56" y="1112.0" font-size="30" font-weight="400" fill="#14251D">客户情况与承诺不能丢</text><text x="600" y="1103.0" font-size="39" font-weight="650" fill="#137A66">CRM</text><text x="600" y="1162.0" font-size="27" font-weight="400" fill="#14251D">记录每个人的沟通与服务进展</text><text x="56" y="1326.0" font-size="33" font-weight="600" fill="#14251D">从“会用工具”，走到“一个人承担更多业务工作”。</text><path d="M56 1369L1024 1369" fill="none" stroke="#C2D1C9" stroke-width="2"/><text x="56" y="1408.0" font-size="23" font-weight="400" fill="#586B60">来源：乔不不斯官网、写作、Partner、工作台与CRM实践。</text><text x="56" y="1440.0" font-size="19" font-weight="400" fill="#586B60">乔不不斯 · AI Native 一人公司</text></g></svg>