name: Maintain HTTPS certificate
on:
  push:
    branches: [main]
    paths: [.github/workflows/repair-https.yml]
  workflow_dispatch:
  schedule:
    - cron: "17 21 * * 1,4"
permissions:
  contents: read
concurrency:
  group: https-certificate-renewal
  cancel-in-progress: false
jobs:
  https:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Renew certificate and start renewal timer
        env:
          SERVER_HOST: ${{ secrets.ALIYUN_HOST }}
          SERVER_USER: ${{ secrets.ALIYUN_USER }}
          SERVER_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          cat > /tmp/acme-proxy.py <<'PROXY'
          import http.server, socket, select
          class Proxy(http.server.BaseHTTPRequestHandler):
              def do_CONNECT(self):
                  host, _, port = self.path.rpartition(':')
                  if host not in {'acme-v02.api.letsencrypt.org', 'acme-staging-v02.api.letsencrypt.org'} or port != '443':
                      self.send_error(403); return
                  try:
                      with socket.create_connection((host, 443), timeout=20) as remote:
                          self.send_response(200); self.end_headers()
                          peers = [self.connection, remote]
                          while True:
                              ready, _, _ = select.select(peers, [], [], 120)
                              if not ready: return
                              for src in ready:
                                  data = src.recv(65536)
                                  if not data: return
                                  (remote if src is self.connection else self.connection).sendall(data)
                  except OSError:
                      self.close_connection = True
              def log_message(self, *args): pass
          http.server.ThreadingHTTPServer(('127.0.0.1', 18889), Proxy).serve_forever()
          PROXY
          python3 /tmp/acme-proxy.py &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true' EXIT
          set +e
          ssh -o ExitOnForwardFailure=yes -o ServerAliveInterval=15 -R 127.0.0.1:18889:127.0.0.1:18889 -i ~/.ssh/key "$SERVER_USER@$SERVER_HOST" 'bash -s' > /tmp/diagnostic.txt 2>&1 <<'REMOTE'
          set -e
          nginx -t
          export HTTPS_PROXY=http://127.0.0.1:18889
          export https_proxy="$HTTPS_PROXY"
          certbot renew --cert-name qiaoboose.com --non-interactive --no-random-sleep-on-renew
          nginx -t
          nginx -s reload
          systemctl enable --now certbot-renew.timer
          systemctl is-active certbot-renew.timer
          systemctl list-timers --all | grep certbot
          certbot certificates
          REMOTE
          result=$?
          set -e
          cat /tmp/diagnostic.txt
          python3 - <<'PYREPORT'
          from pathlib import Path
          s=Path('/tmp/diagnostic.txt').read_text()
          s=s.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::notice title=Renewal result::'+s)
          PYREPORT
          exit "$result"
      - name: Verify public HTTPS
        run: |
          for host in qiaoboose.com www.qiaoboose.com intake.qiaoboose.com; do
            curl --fail --silent --show-error --max-time 30 "https://$host/" -o /dev/null
          done
          curl --fail --silent --show-error --max-time 30 https://qiaoboose.com/latest-event/voyage.html -o /dev/null
          openssl s_client -connect qiaoboose.com:443 -servername qiaoboose.com </dev/null 2>/dev/null | openssl x509 -checkend 2592000 -noout
