<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1200" viewBox="0 0 1080 1200"><g font-family="PingFang SC,Heiti SC,sans-serif"><rect x="0" y="0" width="1080" height="1200" rx="0" fill="#EEF2F0"/><text x="56" y="63.0" font-size="25" font-weight="600" fill="#137A66">本人实践 / 业务线 × AI线</text><text x="56" y="135.0" font-size="49" font-weight="700" fill="#14251D">一人公司，要把两条线一起往前推</text><text x="56" y="191.0" font-size="28" font-weight="400" fill="#586B60">业务提出真实问题，AI扩大完成这些工作的能力。</text><text x="56" y="296.0" font-size="54" font-weight="700" fill="#137A66">业务线</text><text x="56" y="357.0" font-size="35" font-weight="600" fill="#14251D">做什么模式？怎样获得客户？</text><text x="56" y="433.0" font-size="34" font-weight="400" fill="#14251D">选方向 → 懂需求 → 做产品 → 销售 → 交付</text><path d="M56 492L1024 492" fill="none" stroke="#C2D1C9" stroke-width="2"/><text x="56" y="580.0" font-size="54" font-weight="700" fill="#137A66">AI线</text><text x="56" y="641.0" font-size="35" font-weight="600" fill="#14251D">怎样更快做出来，再放大个人产能？</text><text x="56" y="717.0" font-size="32" font-weight="400" fill="#14251D">官网与内容 / 经营判断 / 执行调度 / 客户记录</text><path d="M540 767L540 837" fill="none" stroke="#137A66" stroke-width="3"/><path d="M531 824L540 837" fill="none" stroke="#137A66" stroke-width="3"/><path d="M549 824L540 837" fill="none" stroke="#137A66" stroke-width="3"/><rect x="56" y="867" width="968" height="159" rx="0" fill="#F8FAF9" stroke="#C2D1C9" stroke-width="2"/><text x="84" y="928.0" font-size="38" font-weight="650" fill="#137A66">实际业务结果</text><text x="84" y="990.0" font-size="33" font-weight="400" fill="#14251D">回到产品与工作方式，继续调整下一步。</text><path d="M56 1109L1024 1109" fill="none" stroke="#C2D1C9" stroke-width="2"/><text x="56" y="1148.0" font-size="23" font-weight="400" fill="#586B60">来源：乔不不斯的AI一人公司实践。</text><text x="56" y="1180.0" font-size="19" font-weight="400" fill="#586B60">乔不不斯 · AI Native 一人公司</text></g></svg>