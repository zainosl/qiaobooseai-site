<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1270" viewBox="0 0 1080 1270"><g font-family="PingFang SC,Heiti SC,sans-serif"><rect x="0" y="0" width="1080" height="1270" rx="0" fill="#EEF2F0"/><text x="56" y="63.0" font-size="25" font-weight="600" fill="#137A66">本人起盘 / 商业模式加减法</text><text x="56" y="135.0" font-size="49" font-weight="700" fill="#14251D">从一个大愿望，走到能开始的方向</text><text x="56" y="191.0" font-size="28" font-weight="400" fill="#586B60">不是一次想明白，而是带着依据反复收窄。</text><path d="M91 289L91 978" fill="none" stroke="#137A66" stroke-width="4"/><circle cx="91" cy="284" r="8" fill="#137A66"/><text x="137" y="296.0" font-size="36" font-weight="650" fill="#137A66">人生红点</text><text x="137" y="358.0" font-size="29" font-weight="400" fill="#14251D">通过商业成功，帮助更多人提升思考与行动能力</text><circle cx="91" cy="450" r="8" fill="#137A66"/><text x="137" y="462.0" font-size="36" font-weight="650" fill="#137A66">先定起步范围</text><text x="137" y="524.0" font-size="29" font-weight="400" fill="#14251D">财富相关需求 · 国内个人用户 · 知识服务</text><circle cx="91" cy="616" r="8" fill="#137A66"/><text x="137" y="628.0" font-size="36" font-weight="650" fill="#137A66">约100个想法 → 5个候选</text><text x="137" y="690.0" font-size="29" font-weight="400" fill="#14251D">个人灵感、观察到的模式、AI脑暴，一起比较</text><circle cx="91" cy="782" r="8" fill="#137A66"/><text x="137" y="794.0" font-size="36" font-weight="650" fill="#137A66">调研与交流后继续做减法</text><text x="137" y="856.0" font-size="29" font-weight="400" fill="#14251D">从自己的转型出发，研究一人公司服务</text><circle cx="91" cy="948" r="8" fill="#137A66"/><text x="137" y="960.0" font-size="36" font-weight="650" fill="#137A66">收窄到具体用户和场景</text><text x="137" y="1022.0" font-size="29" font-weight="400" fill="#14251D">谁想改变？谁已经有方向？谁卡在产品或获客？</text><path d="M56 1065L1024 1065" fill="none" stroke="#C2D1C9" stroke-width="2"/><text x="56" y="1126.0" font-size="32" font-weight="600" fill="#14251D">再做商业预判：看机会、硬伤与最需验证的前提。</text><path d="M56 1179L1024 1179" fill="none" stroke="#C2D1C9" stroke-width="2"/><text x="56" 