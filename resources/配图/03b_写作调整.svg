<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1390" viewBox="0 0 1080 1390"><g font-family="PingFang SC,Heiti SC,sans-serif"><rect x="0" y="0" width="1080" height="1390" rx="0" fill="#0B0D0F"/><text x="56" y="63.0" font-size="25" font-weight="600" fill="#58E1C1">本人实践 / AI写作调整</text><text x="56" y="135.0" font-size="49" font-weight="700" fill="#F3F6F4">复杂系统没有替我把话说清楚</text><text x="56" y="191.0" font-size="28" font-weight="400" fill="#AAB6AF">于是，我把改进落回每一篇文章。</text><text x="56" y="284.0" font-size="34" font-weight="600" fill="#AAB6AF">之前</text><text x="56" y="348.0" font-size="36" font-weight="400" fill="#F3F6F4">方法、规则、流程都有，文章仍不贴切。</text><path d="M56 399L1024 399" fill="none" stroke="#36423D" stroke-width="2"/><text x="56" y="475.0" font-size="37" font-weight="600" fill="#58E1C1">先理解意图</text><text x="56" y="540.0" font-size="30" font-weight="400" fill="#F3F6F4">写给谁？我真正想说什么？读者要明白什么？</text><text x="56" y="633.0" font-size="37" font-weight="600" fill="#58E1C1">读真实材料</text><text x="56" y="698.0" font-size="30" font-weight="400" fill="#F3F6F4">经历、原话、过程和结果，先进入写作依据。</text><text x="56" y="791.0" font-size="37" font-weight="600" fill="#58E1C1">逐段具体修改</text><text x="56" y="856.0" font-size="30" font-weight="400" fill="#F3F6F4">指出哪句不对，补原因、动作和结果，保留写对的。</text><text x="56" y="949.0" font-size="37" font-weight="600" fill="#58E1C1">把修改留下来</text><text x="56" y="1014.0" font-size="30" font-weight="400" fill="#F3F6F4">保存采用稿、修改理由与例子，供下次接续。</text><path d="M56 1104L1024 1104" fill="none" stroke="#36423D" stroke-width="2"/><text x="56" y="1163.0" font-size="34" font-weight="600" fill="#58E1C1">调整后</text><text x="56" y="1221.0" font-size="35" font-weight="600" fill="#F3F6F4">更能表达我的意图，也更容易让读者理解。</text><path d="M56 1299L1024 1299" fill="none" stroke="#36423D" stroke-width="2"/><text x="56" y="1338.0" font-size="23" font-weight="400" fill="#AAB6AF">来源：乔不不斯AI写作实践与调整记录。</text><text x="56" y="1370.0" font-size="19" font-weight="400" fill="#AAB6AF">乔不不斯 · AI Native 一人公司</text></g></svg>