<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>乔不不斯的一人公司待办</title>
  <script src="theme-controller.js?v=20260813b"></script>
  <link rel="stylesheet" href="todo-tokens.css?v=20261112">
  <link rel="stylesheet" href="home-theme.css?v=20260813">
  <link rel="stylesheet" href="todo.css?v=20261112">
</head>
<body class="page-todo">
  <main class="app">
    <section class="topbar" aria-label="顶部">
      <div class="brand">
        <div class="eyebrow">QIAOBOOSI / PERSONAL WORKSPACE</div>
        <h1>一人公司待办<span>乔不不斯 · 待办工作台</span></h1>
        <p id="statusLine">准备中…</p>
      </div>
      <div class="toolbar" aria-label="工作台设置">
        <button class="theme-toggle" type="button" data-theme-toggle><span class="theme-toggle__track" aria-hidden="true"></span><span class="theme-toggle__label" data-theme-label>DARK</span></button>
        <details class="data-menu"><summary>数据管理 <span aria-hidden="true">⌄</span></summary><div class="data-menu-content">
        <button type="button" id="exportBtn" title="下载备份" aria-label="下载备份">下载备份</button>
        <button type="button" id="importBtn" title="上传恢复" aria-label="上传恢复">从备份恢复</button>
        <button type="button" id="resetBtn" title="载入初始待办" aria-label="载入初始待办">载入初始待办</button>
        </div></details>
        <input hidden class="file-input" id="importFile" type="file" accept="application/json,.json">
      </div>
    </section>

    <form class="quick-add" id="addForm">
      <div class="field">
        <label for="newTitle">下一步，准备做什么？</label>
        <input id="newTitle" autocomplete="off" placeholder="写下具体行动，按 Enter 添加" maxlength="300">
      </div>
      <div class="field">
        <label for="newQuadrant">象限</label>
        <select id="newQuadrant"></select>
      </div>
      <div class="field">
        <label for="newCategory">主题</label>
        <input id="newCategory" list="categoryList" autocomplete="off" placeholder="可选，如：内容创作">
      </div>
      <button class="primary" type="submit" title="新增任务" aria-label="新增任务">＋ 添加任务</button>
    </form>

    <datalist id="categoryList"></datalist>

    <section class="focus-section" aria-labelledby="focusHeading">
      <div class="section-heading"><div><span class="section-kicker">TODAY</span><h2 id="focusHeading">今日聚焦 <span id="focusCount">0 / 3</span></h2></div><p>先把最重要的三件事，向前推进一步。</p></div>
      <div id="focusList" class="focus-list"></div>
    </section>

    <section class="stats" aria-label="统计">
      <div class="stat"><b id="activeCount">0</b><span>进行中</span></div>
      <div class="stat"><b id="ongoingCount">0</b><span>持续性</span></div>
      <div class="stat"><b id="categoryCount">0</b><span>业务主题</span></div>
      <div class="stat"><b id="topPriority">0/3</b><span>今日聚焦</span></div>
      <div class="stat"><b id="doneCount">0</b><span>已完成</span></div>
    </section>

    <section class="board-toolbar" aria-label="筛选待办">
      <div class="view-switch" role="group" aria-label="任务视图">
        <button type="button" data-view="all" aria-pressed="true">全部待办</button>
        <button type="button" data-view="focus" aria-pressed="false">今日聚焦</button>
      </div>
      <div class="filters">
        <label class="search-field"><span class="sr-only">搜索待办</span><input type="search" id="searchInput" placeholder="搜索任务、备注…" aria-keyshortcuts="/"></label>
        <label><span class="sr-only">筛选主题</span><select id="categoryFilter"><option value="">全部主题</option></select></label>
      </div>
    </section>
    <div class="board-caption"><span id="resultCount" role="status" aria-live="polite"></span><button type="button" id="clearFilters" hidden>清除筛选</button><span class="board-help">点击标题编辑 · 拖动卡片调整象限</span></div>
    <section class="layout">
      <div class="board" id="board" aria-label="待办面板"></div>
      <aside class="side">
        <details class="panel" id="historyPanel">
          <summary>
            <h2>完成历史</h2>
            <span class="count" id="historyCount">0 条</span>
          </summary>
          <div class="history-list" id="historyList"></div>
        </details>
      </aside>
    </section>
  </main>

  <dialog id="editDialog" aria-labelledby="editHeading">
    <form class="modal" id="editForm" method="dialog">
      <header>
        <h2 id="editHeading">编辑待办</h2>
        <button class="icon-button" value="cancel" type="button" id="closeEdit" title="关闭" aria-label="关闭">×</button>
      </header>
      <input type="hidden" id="editId">
      <div class="field">
        <label for="editTitle">待办</label>
        <input id="editTitle" required>
      </div>
      <div class="modal-grid">
        <div class="field">
          <label for="editQuadrant">移动到象限</label>
          <select id="editQuadrant"></select>
        </div>
        <div class="field">
          <label for="editCategory">主题</label>
          <input id="editCategory" list="categoryList">
        </div>
      </div>
      <div class="field">
        <label for="editNote">备注</label>
        <textarea id="editNote"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" id="cancelEdit">取消</button>
        <button class="primary" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const STORAGE_KEY = "solo_company_todo_v1";
    const TODO_API = {
      url: "/todo-api/todo",
      token: "79862g3Q"
    };
    const quadrants = [
      { id: "ongoing", label: "持续性待办" },
      { id: "important_urgent", label: "重要且紧急" },
      { id: "important_not_urgent", label: "重要不紧急" },
      { id: "urgent_not_important", label: "紧急不重要" },
      { id: "not_important_not_urgent", label: "不重要不紧急" }
    ];

    const seedTasks = [
      ["一堂用户需求课", "important_urgent", "用户调研", 95, ""],
      ["微信调研信息整理", "important_urgent", "用户调研", 92, ""],
      ["一堂同学调研", "important_urgent", "用户调研", 88, ""],
      ["私域用户调研", "important_urgent", "用户调研", 86, ""],
      ["短视频工作规划和启动", "important_urgent", "AI短视频", 84, ""],
      ["vikki朋友圈skill", "important_not_urgent", "朋友圈优化", 72, ""],
      ["录制: 0510-普通人学习获客,最大的误区", "important_not_urgent", "核心内容输入", 70, "录制文件：https://meeting.tencent.com/crm/N8PPwRRXc2"],
      ["收藏内容阅读", "ongoing", "核心内容输入", 66, ""],
      ["书单阅读", "ongoing", "核心内容输入", 62, ""],
      ["看 AI 官方内容", "ongoing", "核心内容输入", 60, "官方文档、发布说明、研究/产品更新"]
    ];

    let hasLocalState = false;
    let cloudStatus = "local";
    let cloudTimer = null;
    let state = loadState();
    let toastTimer = null;
    let undoAction = null;
    const view = { query: "", category: "", mode: "all", ongoingOpen: true };
    // Local previews never contact or modify the production task store.
    const isLocalPreview = ["localhost", "127.0.0.1", ""].includes(location.hostname);

    const els = {
      board: document.querySelector("#board"),
      addForm: document.querySelector("#addForm"),
      newTitle: document.querySelector("#newTitle"),
      newQuadrant: document.querySelector("#newQuadrant"),
      newCategory: document.querySelector("#newCategory"),
      categoryList: document.querySelector("#categoryList"),
      statusLine: document.querySelector("#statusLine"),
      activeCount: document.querySelector("#activeCount"),
      ongoingCount: document.querySelector("#ongoingCount"),
      doneCount: document.querySelector("#doneCount"),
      categoryCount: document.querySelector("#categoryCount"),
      topPriority: document.querySelector("#topPriority"),
      historyCount: document.querySelector("#historyCount"),
      historyList: document.querySelector("#historyList"),
      editDialog: document.querySelector("#editDialog"),
      editForm: document.querySelector("#editForm"),
      editId: document.querySelector("#editId"),
      editTitle: document.querySelector("#editTitle"),
      editQuadrant: document.querySelector("#editQuadrant"),
      editCategory: document.querySelector("#editCategory"),
      editNote: document.querySelector("#editNote"),
      exportBtn: document.querySelector("#exportBtn"),
      importBtn: document.querySelector("#importBtn"),
      resetBtn: document.querySelector("#resetBtn"),
      importFile: document.querySelector("#importFile"),
      closeEdit: document.querySelector("#closeEdit"),
      cancelEdit: document.querySelector("#cancelEdit"),
      toast: document.querySelector("#toast")
    };

    function nowIso() {
      return new Date().toISOString();
    }

    function makeId() {
      return "task_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
    }

    function createTask(title, quadrant, category, note, order) {
      const timestamp = nowIso();
      return {
        id: makeId(),
        title: title.trim(),
        quadrant,
        category: (category || "未归类").trim(),
        priority: 50,
        order: Number.isFinite(Number(order)) ? Number(order) : nextOrderForQuadrant(quadrant, true),
        focused: false,
        status: "active",
        note: (note || "").trim(),
        createdAt: timestamp,
        updatedAt: timestamp,
        completedAt: null
      };
    }

    function createSeedState() {
      return {
        version: 1,
        updatedAt: nowIso(),
        tasks: seedTasks.map(([title, quadrant, category, priority, note], index) =>
          createTask(title, quadrant, category, note, index)
        )
      };
    }

    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        const seeded = createSeedState();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seeded));
        return seeded;
      }

      try {
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.tasks)) {
          throw new Error("Invalid local data");
        }
        hasLocalState = true;
        return {
          version: parsed.version || 1,
          updatedAt: parsed.updatedAt || nowIso(),
          tasks: migrateTaskOrder(parsed.tasks.map(normalizeTask))
        };
      } catch (error) {
        console.warn(error);
        const backupKey = STORAGE_KEY + "_broken_" + Date.now();
        localStorage.setItem(backupKey, raw);
        const seeded = createSeedState();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(seeded));
        return seeded;
      }
    }

    function normalizeTask(task) {
      const timestamp = task.createdAt || nowIso();
      return {
        id: task.id || makeId(),
        title: String(task.title || "").trim() || "未命名任务",
        quadrant: quadrants.some(q => q.id === task.quadrant) ? task.quadrant : "important_not_urgent",
        category: String(task.category || "未归类").trim(),
        priority: clampPriority(task.priority),
        order: Number.isFinite(Number(task.order)) ? Number(task.order) : null,
        focused: Boolean(task.focused),
        status: task.status === "completed" ? "completed" : "active",
        note: String(task.note || "").trim(),
        createdAt: timestamp,
        updatedAt: task.updatedAt || timestamp,
        completedAt: task.completedAt || null
      };
    }

    function clampPriority(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return 50;
      return Math.max(1, Math.min(100, Math.round(number)));
    }

    function migrateTaskOrder(tasks) {
      const grouped = new Map();
      tasks.forEach(task => {
        if (!grouped.has(task.quadrant)) grouped.set(task.quadrant, []);
        grouped.get(task.quadrant).push(task);
      });

      grouped.forEach(items => {
        const needsMigration = items.some(task => task.order === null);
        if (!needsMigration) return;
        [...items]
          .sort((a, b) => {
            if (b.priority !== a.priority) return b.priority - a.priority;
            return String(a.createdAt).localeCompare(String(b.createdAt));
          })
          .forEach((task, index) => {
            task.order = index;
          });
      });

      return tasks.map(task => ({
        ...task,
        order: task.order === null ? 0 : task.order,
        focused: task.status === "active" && task.focused
      }));
    }

    function nextOrderForQuadrant(quadrant, placeAtTop = false) {
      const orders = state && Array.isArray(state.tasks)
        ? state.tasks
            .filter(task => task.status === "active" && task.quadrant === quadrant)
            .map(task => Number(task.order))
            .filter(Number.isFinite)
        : [];
      if (!orders.length) return 0;
      return placeAtTop ? Math.min(...orders) - 1 : Math.max(...orders) + 1;
    }

    function saveState(message) {
      state.updatedAt = nowIso();
      // 本地始终保留一份，作为离线兜底
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if (!isLocalPreview) queueCloudSave();
      render();
      if (message) showToast(message);
    }

    function apiHeaders() {
      return {
        "Authorization": "Bearer " + TODO_API.token,
        "Content-Type": "application/json"
      };
    }

    function normalizeState(payload) {
      return {
        version: payload.version || 1,
        updatedAt: payload.updatedAt || nowIso(),
        tasks: migrateTaskOrder((payload.tasks || []).map(normalizeTask))
      };
    }

    async function fetchCloudState() {
      const response = await fetch(TODO_API.url, {
        headers: { "Authorization": "Bearer " + TODO_API.token },
        cache: "no-store"
      });
      if (!response.ok) throw new Error("cloud fetch failed");
      return response.json();
    }

    async function saveCloudNow() {
      cloudStatus = "syncing";
      renderStatusLine();
      const response = await fetch(TODO_API.url, {
        method: "PUT",
        headers: apiHeaders(),
        body: JSON.stringify(state)
      });
      if (!response.ok) throw new Error("cloud save failed");
      const result = await response.json();
      if (result.updatedAt) {
        state.updatedAt = result.updatedAt;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }
      cloudStatus = "synced";
      renderStatusLine();
    }

    function queueCloudSave() {
      clearTimeout(cloudTimer);
      cloudStatus = "syncing";
      cloudTimer = setTimeout(() => {
        saveCloudNow().catch(error => {
          console.warn(error);
          cloudStatus = "error";
          renderStatusLine();
          showToast("云端保存失败，本地已保存");
        });
      }, 500);
    }

    async function syncFromCloud() {
      cloudStatus = "syncing";
      renderStatusLine();
      try {
        const cloud = await fetchCloudState();
        const cloudHasTasks = Array.isArray(cloud.tasks) && cloud.tasks.length > 0;
        const localHasTasks = Array.isArray(state.tasks) && state.tasks.length > 0;
        const cloudTime = cloud.updatedAt ? Date.parse(cloud.updatedAt) : 0;
        const localTime = state.updatedAt ? Date.parse(state.updatedAt) : 0;

        if (cloudHasTasks && (!hasLocalState || cloudTime >= localTime)) {
          state = normalizeState(cloud);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          cloudStatus = "synced";
          render();
          showToast("云端待办已同步");
          return;
        }

        if (localHasTasks && (!cloudHasTasks || localTime > cloudTime)) {
          await saveCloudNow();
          showToast(cloudHasTasks ? "本地新版本已上传云端" : "本地待办已初始化到云端");
          return;
        }

        cloudStatus = "synced";
        renderStatusLine();
      } catch (error) {
        console.warn(error);
        cloudStatus = "error";
        renderStatusLine();
        showToast("云端同步失败，继续使用本地数据");
      }
    }

    function showToast(message, undo = null) {
      clearTimeout(toastTimer);
      undoAction = undo;
      els.toast.replaceChildren(document.createTextNode(message));
      if (undo) {
        const button = document.createElement("button");
        button.textContent = "撤销";
        button.type = "button";
        button.addEventListener("click", () => {
          const action = undoAction;
          undoAction = null;
          if (action) action();
        });
        els.toast.append(button);
      }
      els.toast.classList.add("show");
      toastTimer = setTimeout(() => {
        els.toast.classList.remove("show");
        undoAction = null;
      }, undo ? 10000 : 3500);
    }

    function saveWithUndo(message, previousTask) {
      saveState();
      showToast(message, () => {
        const index = state.tasks.findIndex(task => task.id === previousTask.id);
        const restored = { ...previousTask, updatedAt: nowIso() };
        // Respect the focus cap if other tasks were focused after this action.
        if (restored.focused && activeTasks().filter(task => task.id !== restored.id && task.focused).length >= 3) restored.focused = false;
        if (index < 0) state.tasks.push(restored);
        else state.tasks[index] = restored;
        saveState("已撤销");
      });
    }

    function setupOptions() {
      const optionHtml = quadrants.map(q => `<option value="${q.id}">${q.label}</option>`).join("");
      els.newQuadrant.innerHTML = optionHtml;
      els.editQuadrant.innerHTML = optionHtml;
    }

    function activeTasks() {
      return state.tasks.filter(task => task.status === "active");
    }

    function completedTasks() {
      return state.tasks
        .filter(task => task.status === "completed")
        .sort((a, b) => String(b.completedAt).localeCompare(String(a.completedAt)));
    }

    function sortedTasks(tasks) {
      return [...tasks].sort((a, b) => {
        if (a.order !== b.order) return a.order - b.order;
        return String(a.createdAt).localeCompare(String(b.createdAt));
      });
    }

    function render() {
      const focusedElement = document.activeElement;
      const focusedCard = focusedElement?.closest("[data-id]");
      const focusedAction = focusedElement?.dataset.action;
      const focusedRegion = focusedElement?.closest("#focusList, #board, #historyList")?.id;
      const focusedId = focusedCard?.dataset.id;
      renderCategoryList();
      renderBoard();
      renderFocus();
      renderHistory();
      renderStats();
      renderStatusLine();
      if (focusedId && focusedAction && focusedRegion) {
        const region = document.getElementById(focusedRegion);
        const replacement = [...region.querySelectorAll("[data-id]")].find(card => card.dataset.id === focusedId);
        const target = replacement?.querySelector(`[data-action="${focusedAction}"]`) || region.querySelector("button[data-action]");
        if (target) target.focus({ preventScroll: true });
      }
    }

    function renderStatusLine() {
      const prefix = isLocalPreview ? "本地预览 · 数据仅保存在此浏览器" : cloudStatus === "synced"
        ? "云端已同步"
        : cloudStatus === "syncing"
          ? "云端同步中…"
          : cloudStatus === "error"
            ? "云端异常，本地已保存"
            : "本地已保存";
      els.statusLine.textContent = prefix + " · " + formatDateTime(state.updatedAt);
    }

    function renderCategoryList() {
      const categories = [...new Set(state.tasks.map(task => task.category).filter(Boolean))].sort();
      els.categoryList.innerHTML = categories.map(category => `<option value="${escapeHtml(category)}"></option>`).join("");
      const filter = document.querySelector("#categoryFilter");
      filter.innerHTML = '<option value="">全部主题</option>' + categories.map(category => `<option value="${escapeHtml(category)}">${escapeHtml(category)}</option>`).join("");
      if (view.category && !categories.includes(view.category)) view.category = "";
      filter.value = view.category;
    }

    function matchesFilters(task) {
      return (!view.category || task.category === view.category) &&
        (!view.query || [task.title, task.category, task.note].join(" ").toLocaleLowerCase().includes(view.query.toLocaleLowerCase())) &&
        (view.mode !== "focus" || task.focused);
    }

    function filtersActive() { return Boolean(view.query || view.category || view.mode !== "all"); }

    function renderBoard() {
      const active = activeTasks().filter(matchesFilters);
      document.querySelector("#resultCount").textContent = filtersActive() ? `找到 ${active.length} 项待办` : `共 ${active.length} 项待办`;
      document.querySelector("#clearFilters").hidden = !filtersActive();
      document.querySelector(".board-help").textContent = filtersActive() ? "点击标题编辑 · 清除筛选后可拖动排序" : "点击标题编辑 · 拖动卡片调整象限";
      document.querySelectorAll("[data-view]").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.view === view.mode)));
      const hints = { important_urgent: "优先处理", important_not_urgent: "留出时间，持续推进", urgent_not_important: "尽量简化或委托", not_important_not_urgent: "暂缓，留给以后", ongoing: "保持节奏，长期积累" };
      const orderedQuadrants = [...quadrants.slice(1), quadrants[0]];
      els.board.innerHTML = orderedQuadrants.map(quadrant => {
        const tasks = sortedTasks(active.filter(task => task.quadrant === quadrant.id));
        const ongoing = quadrant.id === "ongoing";
        const tag = ongoing ? "details" : "section";
        const header = ongoing ? "summary" : "header";
        return `<${tag} class="quadrant q-${quadrant.id}" data-quadrant="${quadrant.id}" ${ongoing && view.ongoingOpen ? "open" : ""}>
          <${header}><div><h2>${quadrant.label} <span class="count">${tasks.length}</span></h2><p>${hints[quadrant.id]}</p></div>
          ${ongoing ? "" : `<button type="button" class="add-in-quadrant" data-add="${quadrant.id}" aria-label="添加到${quadrant.label}" title="添加到${quadrant.label}">＋</button>`}</${header}>
          <div class="tasks" data-dropzone="${quadrant.id}">
            ${tasks.length ? tasks.map(renderTask).join("") : `<div class="empty">${filtersActive() ? "此象限没有匹配的任务" : "暂时没有待办"}<button type="button" data-add="${quadrant.id}">＋ 添加任务</button></div>`}
          </div>
        </${tag}>`;
      }).join("");
      els.board.querySelector("details").addEventListener("toggle", event => { view.ongoingOpen = event.target.open; });
    }

    function renderFocus() {
      const tasks = sortedTasks(activeTasks().filter(task => task.focused));
      document.querySelector("#focusCount").textContent = tasks.length + " / 3";
      document.querySelector("#focusList").innerHTML = tasks.map((task, index) => `
        <article class="focus-card" data-id="${escapeHtml(task.id)}">
          <span class="focus-number">0${index + 1}</span>
          <div><button class="task-title" type="button" data-action="edit">${escapeHtml(task.title)}</button><p>${escapeHtml(task.category)}</p></div>
          <button class="complete-button" type="button" data-action="complete" aria-label="完成：${escapeHtml(task.title)}" title="标记完成">✓</button>
        </article>`).join("") + Array.from({ length: Math.max(0, 3 - tasks.length) }, (_, index) => `
        <button type="button" class="focus-placeholder" data-pick-focus><span class="focus-number">0${tasks.length + index + 1}</span><span>选一件今天要推进的事<small>点击任务上的 ☆ 加入聚焦</small></span><span aria-hidden="true">＋</span></button>`).join("");
    }

    function renderTask(task) {
      const note = linkify(task.note);
      return `<article class="task${task.focused ? " focused" : ""}" data-id="${escapeHtml(task.id)}" draggable="${!filtersActive()}">
          <button class="complete-button" type="button" data-action="complete" title="标记完成" aria-label="完成：${escapeHtml(task.title)}">✓</button>
          <div class="task-body">
            <button class="task-title" type="button" data-action="edit" title="编辑任务">${escapeHtml(task.title)}</button>
            <div class="task-meta"><span class="pill">${escapeHtml(task.category)}</span>${task.focused ? '<span class="focus-pill">今日聚焦</span>' : ""}<span title="最近更新">${formatDate(task.updatedAt)}</span></div>
            ${note ? `<div class="note">${note}</div>` : ""}
          </div>
          <div class="actions">
            <button type="button" data-action="focus" aria-pressed="${task.focused}" title="${task.focused ? "移出今日聚焦" : "加入今日聚焦"}" aria-label="${task.focused ? "移出今日聚焦" : "加入今日聚焦"}：${escapeHtml(task.title)}">${task.focused ? "★" : "☆"}</button>
            <details class="task-menu"><summary aria-label="更多操作：${escapeHtml(task.title)}" title="更多操作">⋯</summary><div class="task-menu-content">
              <button type="button" data-action="edit">编辑 / 移动</button>
              <button type="button" class="danger" data-action="delete">删除任务</button>
            </div></details>
          </div>
        </article>`;
    }

    function renderHistory() {
      const done = completedTasks();
      els.historyCount.textContent = done.length + " 条";
      els.historyList.innerHTML = done.length ? done.map(task => `
        <article class="history-item" data-id="${task.id}">
          <div class="history-title">${escapeHtml(task.title)}</div>
          <div class="history-meta">
            ${escapeHtml(labelForQuadrant(task.quadrant))} · ${escapeHtml(task.category)}<br>
            ${formatDateTime(task.completedAt)}
          </div>
          <div class="history-actions">
            <button type="button" data-action="restore" title="恢复" aria-label="恢复">↩</button>
            <button type="button" class="danger" data-action="delete" title="删除" aria-label="删除">×</button>
          </div>
        </article>
      `).join("") : `<div class="empty">暂无完成记录</div>`;
    }

    function renderStats() {
      const active = activeTasks();
      const done = completedTasks();
      const categories = new Set(state.tasks.filter(task => task.status === "active").map(task => task.category));
      const focusedCount = active.filter(task => task.focused).length;
      els.activeCount.textContent = active.length;
      els.ongoingCount.textContent = active.filter(task => task.quadrant === "ongoing").length;
      els.doneCount.textContent = done.length;
      els.categoryCount.textContent = categories.size;
      els.topPriority.textContent = focusedCount + "/3";
    }

    function labelForQuadrant(id) {
      return (quadrants.find(q => q.id === id) || quadrants[1]).label;
    }

    function formatDate(value) {
      if (!value) return "-";
      return new Intl.DateTimeFormat("zh-CN", { month: "2-digit", day: "2-digit" }).format(new Date(value));
    }

    function formatDateTime(value) {
      if (!value) return "-";
      return new Intl.DateTimeFormat("zh-CN", {
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }).format(new Date(value));
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function linkify(value) {
      const escaped = escapeHtml(value || "");
      return escaped.replace(/https?:\/\/[^\s<]+/g, url => {
        const clean = url.replace(/[，。；、）)]$/, "");
        const tail = url.slice(clean.length);
        return `<a href="${clean}" target="_blank" rel="noreferrer">${clean}</a>${tail}`;
      });
    }

    function findTask(id) {
      return state.tasks.find(task => task.id === id);
    }

    function touchTask(task) {
      task.updatedAt = nowIso();
    }

    function openEdit(task) {
      els.editId.value = task.id;
      els.editTitle.value = task.title;
      els.editQuadrant.value = task.quadrant;
      els.editCategory.value = task.category;
      els.editNote.value = task.note;
      els.editDialog.showModal();
      els.editTitle.focus();
    }

    function handleTaskAction(event) {
      const button = event.target.closest("button[data-action]");
      if (!button) return;

      const item = button.closest("[data-id]");
      const task = item ? findTask(item.dataset.id) : null;
      if (!task) return;

      const action = button.dataset.action;
      const previousTask = { ...task };
      if (action === "complete") {
        task.status = "completed";
        task.focused = false;
        task.completedAt = nowIso();
        touchTask(task);
        saveWithUndo("已完成，向前一步。", previousTask);
      }

      if (action === "focus") {
        if (!task.focused && activeTasks().filter(item => item.focused).length >= 3) {
          showToast("今日聚焦最多 3 个");
          return;
        }
        task.focused = !task.focused;
        touchTask(task);
        saveState(task.focused ? "已加入今日聚焦" : "已取消聚焦");
      }

      if (action === "edit") {
        openEdit(task);
      }

      if (action === "restore") {
        task.status = "active";
        task.completedAt = null;
        task.order = nextOrderForQuadrant(task.quadrant, true);
        touchTask(task);
        saveWithUndo("已恢复到待办", previousTask);
      }

      if (action === "delete") {
        const ok = confirm("删除「" + task.title + "」？");
        if (!ok) return;
        state.tasks = state.tasks.filter(item => item.id !== task.id);
        saveWithUndo("任务已删除", previousTask);
      }
    }

    function getDragAfterElement(container, y) {
      const cards = [...container.querySelectorAll(".task:not(.dragging)")];
      return cards.reduce((closest, card) => {
        const box = card.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset, element: card };
        }
        return closest;
      }, { offset: Number.NEGATIVE_INFINITY, element: null }).element;
    }

    let dragCommitted = false;
    let draggingId = null;
    function handleDragStart(event) {
      const card = event.target.closest(".task");
      if (!card || filtersActive() || event.target.closest("button, input, select, textarea, a, summary")) { event.preventDefault(); return; }
      dragCommitted = false;
      draggingId = card.dataset.id;
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", card.dataset.id);
      card.classList.add("dragging");
    }

    function handleDragEnd(event) {
      const card = event.target.closest(".task");
      if (card) card.classList.remove("dragging");
      if (!dragCommitted) renderBoard();
      draggingId = null;
    }

    function handleDragOver(event) {
      const zone = event.target.closest("[data-dropzone]");
      if (!zone) return;
      event.preventDefault();

      const dragging = els.board.querySelector(".task.dragging");
      if (!dragging) return;

      const empty = zone.querySelector(".empty");
      if (empty) empty.remove();

      const afterElement = getDragAfterElement(zone, event.clientY);
      if (afterElement) {
        zone.insertBefore(dragging, afterElement);
      } else {
        zone.append(dragging);
      }
    }

    function handleDrop(event) {
      const zone = event.target.closest("[data-dropzone]");
      if (!zone || !draggingId || !els.board.querySelector(".task.dragging")) return;
      event.preventDefault();
      dragCommitted = true;
      persistBoardOrder();
      saveState("排序已保存");
    }

    function persistBoardOrder() {
      els.board.querySelectorAll("[data-dropzone]").forEach(zone => {
        const quadrant = zone.dataset.dropzone;
        [...zone.querySelectorAll(".task")].forEach((card, index) => {
          const task = findTask(card.dataset.id);
          if (!task) return;
          task.quadrant = quadrant;
          task.order = index;
          touchTask(task);
        });
      });
    }

    els.addForm.addEventListener("submit", event => {
      event.preventDefault();
      const title = els.newTitle.value.trim();
      if (!title) {
        showToast("请先写入待办");
        els.newTitle.focus();
        return;
      }

      const task = createTask(
        title,
        els.newQuadrant.value,
        els.newCategory.value.trim() || "未归类",
        "",
        nextOrderForQuadrant(els.newQuadrant.value, true)
      );
      state.tasks.push(task);
      els.newTitle.value = "";
      clearFilters();
      if (task.quadrant === "ongoing") view.ongoingOpen = true;
      saveState("已添加任务");
      els.newTitle.focus();
    });

    function clearFilters() {
      view.query = ""; view.category = ""; view.mode = "all";
      document.querySelector("#searchInput").value = "";
      document.querySelector("#categoryFilter").value = "";
      renderBoard();
    }
    document.querySelector("#searchInput").addEventListener("input", event => { view.query = event.target.value.trim(); renderBoard(); });
    document.querySelector("#categoryFilter").addEventListener("change", event => { view.category = event.target.value; renderBoard(); });
    document.querySelector("#clearFilters").addEventListener("click", clearFilters);
    document.querySelectorAll("[data-view]").forEach(button => button.addEventListener("click", () => { view.mode = button.dataset.view; renderBoard(); }));
    document.querySelector("#focusList").addEventListener("click", event => {
      handleTaskAction(event);
      if (event.target.closest("[data-pick-focus]")) {
        clearFilters();
        const star = els.board.querySelector('[data-action="focus"][aria-pressed="false"]');
        if (star) { star.scrollIntoView({ block: "center", behavior: "smooth" }); star.focus({ preventScroll: true }); }
        else { els.newTitle.focus(); showToast("先添加一项待办，再加入今日聚焦"); }
      }
    });
    els.board.addEventListener("click", event => {
      handleTaskAction(event);
      const addButton = event.target.closest("[data-add]");
      if (addButton) { els.newQuadrant.value = addButton.dataset.add; els.newTitle.focus(); els.newTitle.scrollIntoView({ block: "center", behavior: "smooth" }); }
    });
    document.addEventListener("keydown", event => {
      if (event.key === "/" && !event.metaKey && !event.ctrlKey && !event.altKey && !els.editDialog.open && !event.target.closest('input, textarea, select, [contenteditable="true"]')) {
        event.preventDefault(); document.querySelector("#searchInput").focus();
      }
      if (event.key === "Escape") document.querySelectorAll(".data-menu[open], .task-menu[open]").forEach(menu => { menu.open = false; menu.querySelector("summary").focus(); });
    });
    document.addEventListener("click", event => document.querySelectorAll(".data-menu[open], .task-menu[open]").forEach(menu => { if (!menu.contains(event.target)) menu.open = false; }));
    els.board.addEventListener("dragstart", handleDragStart);
    els.board.addEventListener("dragend", handleDragEnd);
    els.board.addEventListener("dragover", handleDragOver);
    els.board.addEventListener("drop", handleDrop);
    els.historyList.addEventListener("click", handleTaskAction);

    els.editForm.addEventListener("submit", event => {
      event.preventDefault();
      const task = findTask(els.editId.value);
      if (!task) return;

      const title = els.editTitle.value.trim();
      if (!title) {
        showToast("待办不能为空");
        return;
      }

      task.title = title;
      if (task.quadrant !== els.editQuadrant.value) {
        task.quadrant = els.editQuadrant.value;
        task.order = nextOrderForQuadrant(task.quadrant, true);
      }
      task.category = (els.editCategory.value || "未归类").trim();
      task.note = els.editNote.value.trim();
      touchTask(task);
      els.editDialog.close();
      saveState("已保存");
    });

    els.closeEdit.addEventListener("click", () => els.editDialog.close());
    els.cancelEdit.addEventListener("click", () => els.editDialog.close());

    els.exportBtn.addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = "solo-company-todo-" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.append(anchor);
      anchor.click();
      anchor.remove();
      URL.revokeObjectURL(url);
      showToast("备份已下载");
    });

    els.importBtn.addEventListener("click", () => els.importFile.click());

    els.importFile.addEventListener("change", async event => {
      const file = event.target.files[0];
      if (!file) return;

      try {
        const text = await file.text();
        const imported = JSON.parse(text);
        if (!imported || !Array.isArray(imported.tasks)) {
          throw new Error("Invalid JSON");
        }
        const ok = confirm("恢复备份将替换当前待办，并同步到云端。建议先下载备份，继续？");
        if (!ok) return;
        state = {
          version: imported.version || 1,
          updatedAt: nowIso(),
          tasks: migrateTaskOrder(imported.tasks.map(normalizeTask))
        };
        saveState("备份已恢复");
      } catch (error) {
        console.warn(error);
        showToast("上传失败");
      } finally {
        els.importFile.value = "";
      }
    });

    els.resetBtn.addEventListener("click", () => {
      const ok = confirm("初始待办将替换当前所有待办，并同步到云端。建议先下载备份，继续？");
      if (!ok) return;
      state = createSeedState();
      saveState("已载入初始待办");
    });

    setupOptions();
    els.newQuadrant.value = "important_urgent";
    render();
    if (!isLocalPreview) syncFromCloud();
  </script>
</body>
</html>
