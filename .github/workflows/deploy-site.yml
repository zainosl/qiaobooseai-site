name: Deploy site to Aliyun

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Check ICP footer
        run: grep -q "粤ICP备2026086998号" index.html

      - name: Configure SSH
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ALIYUN_SSH_KEY" > ~/.ssh/aliyun_deploy_key
          chmod 600 ~/.ssh/aliyun_deploy_key
          ssh-keyscan -H "$ALIYUN_HOST" >> ~/.ssh/known_hosts

      - name: Deploy static site
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='server' \
            -czf /tmp/qiaoboose-site.tar.gz .

          ssh -i ~/.ssh/aliyun_deploy_key "$ALIYUN_USER@$ALIYUN_HOST" '
            set -e
            rm -rf /tmp/qiaoboose-site-next
            mkdir -p /tmp/qiaoboose-site-next
          '

          scp -i ~/.ssh/aliyun_deploy_key /tmp/qiaoboose-site.tar.gz "$ALIYUN_USER@$ALIYUN_HOST:/tmp/qiaoboose-site.tar.gz"

          ssh -i ~/.ssh/aliyun_deploy_key "$ALIYUN_USER@$ALIYUN_HOST" '
            set -e
            tar -xzf /tmp/qiaoboose-site.tar.gz -C /tmp/qiaoboose-site-next
            rm -rf /var/www/qiaoboose-site
            mv /tmp/qiaoboose-site-next /var/www/qiaoboose-site
            rm -f /tmp/qiaoboose-site.tar.gz
            nginx -t
            nginx -s reload
          '

      - name: Deploy CRM cloud store
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
        run: |
          scp -i ~/.ssh/aliyun_deploy_key server/crm-api/server.py "$ALIYUN_USER@$ALIYUN_HOST:/tmp/qiaoboose-crm-api.py"

          ssh -i ~/.ssh/aliyun_deploy_key "$ALIYUN_USER@$ALIYUN_HOST" '
            set -e
            mkdir -p /opt/qiaoboose-crm-api /var/lib/qiaoboose-crm
            mv /tmp/qiaoboose-crm-api.py /opt/qiaoboose-crm-api/server.py
            chmod 755 /opt/qiaoboose-crm-api/server.py

            cat > /etc/systemd/system/qiaoboose-crm-api.service <<'"'"'SERVICE'"'"'
          [Unit]
          Description=Qiaoboose CRM JSON API
          After=network.target

          [Service]
          Type=simple
          Environment=CRM_API_TOKEN=79862g3Q
          Environment=CRM_DATA_DIR=/var/lib/qiaoboose-crm
          ExecStart=/usr/bin/python3 /opt/qiaoboose-crm-api/server.py
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          SERVICE

            cp /etc/nginx/conf.d/ability-intake.conf /etc/nginx/conf.d/ability-intake.conf.bak.$(date +%F-%H%M%S)
            cat > /etc/nginx/conf.d/ability-intake.conf <<'"'"'NGINX'"'"'
          server {
              listen 80;
              server_name qiaoboose.com www.qiaoboose.com intake.qiaoboose.com;
              return 301 https://$host$request_uri;
          }

          server {
              listen 443 ssl;
              server_name qiaoboose.com www.qiaoboose.com;

              ssl_certificate /etc/letsencrypt/live/qiaoboose.com/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/qiaoboose.com/privkey.pem;
              include /etc/letsencrypt/options-ssl-nginx.conf;
              ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

              location /crm-api/ {
                  proxy_pass http://127.0.0.1:8790/;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              root /var/www/qiaoboose-site;
              index index.html;

              location / {
                  try_files $uri $uri/ /index.html;
              }
          }

          server {
              listen 443 ssl;
              server_name intake.qiaoboose.com;

              ssl_certificate /etc/letsencrypt/live/qiaoboose.com/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/qiaoboose.com/privkey.pem;
              include /etc/letsencrypt/options-ssl-nginx.conf;
              ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

              client_max_body_size 50m;

              location / {
                  proxy_pass http://127.0.0.1:8787;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 300s;
                  proxy_send_timeout 300s;
              }
          }
          NGINX

            rm -f /var/www/qiaoboose-site/crm-api-deploy-debug.txt
            systemctl daemon-reload
            python3 -m py_compile /opt/qiaoboose-crm-api/server.py
            systemctl enable --now qiaoboose-crm-api.service
            systemctl restart qiaoboose-crm-api.service
            sleep 1
            systemctl is-active --quiet qiaoboose-crm-api.service
            nginx -t
            nginx -s reload
          '
