<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1560" viewBox="0 0 1080 1560"><g font-family="PingFang SC,Heiti SC,sans-serif"><rect x="0" y="0" width="1080" height="1560" rx="0" fill="#0B0D0F"/><text x="56" y="63.0" font-size="25" font-weight="600" fill="#58E1C1">本人起盘 / 用户需求与产品内核</text><text x="56" y="135.0" font-size="49" font-weight="700" fill="#F3F6F4">我的产品想法，怎样被用户改写</text><text x="56" y="191.0" font-size="28" font-weight="400" fill="#AAB6AF">最初以为：用户要做IP、做自媒体、找客户。</text><text x="56" y="290.0" font-size="68" font-weight="700" fill="#58E1C1">20余位</text><text x="590" y="290.0" font-size="68" font-weight="700" fill="#58E1C1">20余份</text><text x="56" y="347.0" font-size="29" font-weight="400" fill="#AAB6AF">本人深度调研</text><text x="590" y="347.0" font-size="29" font-weight="400" fill="#AAB6AF">本人收集的问卷</text><path d="M56 391L1024 391" fill="none" stroke="#36423D" stroke-width="2"/><text x="56" y="459.0" font-size="33" font-weight="600" fill="#58E1C1">找人不顺</text><text x="56" y="516.0" font-size="30" font-weight="400" fill="#F3F6F4">名单人群太散；直接邀约深入交流也有阻力。</text><path d="M56 548L1024 548" fill="none" stroke="#36423D" stroke-width="2"/><text x="56" y="591.0" font-size="33" font-weight="600" fill="#58E1C1">换调研入口</text><text x="56" y="648.0" font-size="30" font-weight="400" fill="#F3F6F4">把问卷做成路径校准器，回收另一类用户材料。</text><path d="M56 680L1024 680" fill="none" stroke="#36423D" stroke-width="2"/><text x="56" y="723.0" font-size="33" font-weight="600" fill="#58E1C1">看清真正需求</text><text x="56" y="780.0" font-size="30" font-weight="400" fill="#F3F6F4">完成0～1变现，并沉淀自己的方法论。</text><path d="M56 812L1024 812" fill="none" stroke="#36423D" stroke-width="2"/><text x="56" y="855.0" font-size="33" font-weight="600" fill="#58E1C1">重做分析</text><text x="56" y="912.0" font-size="30" font-weight="400" fill="#F3F6F4">手打任务地图；再看旧办法、满意度与切入机会。</text><path d="M56 944L1024 944" fill="none" stroke="#36423D" stroke-width="2"/><text x="56" y="1064.0" font-size="39" font-weight="650" fill="#F3F6F4">推出咨询与陪跑两项服务</text><text x="56" y="1127.0" font-size="34" font-weight="400" fill="#F3F6F4">解决具体问题 / 持续推进变现并沉淀方法</text><path d="M56 1184L1024 1184" fill="none" stroke="#36423D" stroke-width="2"/><text x="56" y="1250.0" font-size="35" font-weight="600" fill="#F3F6F4">服务内核确定 → 制作产品 → 向用户销售</text><text x="56" y="1324.0" font-size="37" font-weight="600" fill="#F3F6F4">首次发布 · 18位线上用户</text><text x="56" y="1417.0" font-size="64" font-weight="700" fill="#58E1C1">其中7位直接付费</text><path d="M56 1469L1024 1469" fill="none" stroke="#36423D" stroke-width="2"/><text x="56" y="1508.0" font-size="23" font-weight="400" fill="#AAB6AF">来源：乔不不斯需求调研、产品制作与服务实践。</text><text x="56" y="1540.0" font-size="19" font-weight="400" fill="#AAB6AF">乔不不斯 · AI Native 一人公司</text></g></svg>